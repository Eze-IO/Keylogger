name: release

# Publishes the package to NuGet when a version tag is pushed, e.g.
#   git tag v1.1.0 && git push origin v1.1.0
# The tag version (without the leading "v") overrides <Version> in the csproj.
# Requires a repository secret named NUGET_API_KEY.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/Keyboard.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
